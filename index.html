<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081326">
<meta name="description" content="Digital Freedom International : guides numériques, intelligence artificielle et ressources pratiques.">
<title>Digital Freedom International</title>
<style>
:root{--bg:#07111f;--panel:#122441;--text:#f5f7ff;--muted:#b7c4d9;--blue:#438bff;--violet:#7160ff;--cyan:#64e2f1;--gold:#f2c875;--line:#263a58}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#173d73,transparent 38%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.65}
a{color:inherit;text-decoration:none}
.wrap{width:min(1100px,92%);margin:auto}
header{position:sticky;top:0;z-index:10;background:#081326ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;line-height:1.2}
.mark{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--violet));font-size:20px}
.brand small{display:block;letter-spacing:3px;color:var(--muted);font-size:12px;margin-top:5px}
button,input{font:inherit}
.lang{border:1px solid var(--line);background:#10213b;color:white;border-radius:12px;padding:9px 14px;cursor:pointer}
.hero{padding:68px 0 45px}
.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px}
h1{font-size:clamp(38px,7vw,70px);line-height:1.08;letter-spacing:-2px;margin:20px 0}
.gradient{background:linear-gradient(100deg,#fff,#8ccaff,#b9a1ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2.5vw,21px);color:var(--muted);max-width:760px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:15px;font-weight:800;border:1px solid var(--line)}
.primary{background:linear-gradient(120deg,var(--blue),var(--violet));border:0}
.secondary{background:#ffffff08}
.feature{margin:20px 0 55px;padding:30px;border:1px solid #ffffff16;border-radius:26px;background:linear-gradient(125deg,#1a3764,#0d192d)}
.feature h2{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:12px 0}
.feature p{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pill{border:1px solid #ffffff1a;border-radius:12px;padding:9px 12px;background:#ffffff08;font-weight:bold}
section{padding:25px 0 50px}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:22px}
h2{font-size:clamp(28px,4vw,40px);line-height:1.2;margin:8px 0}
.muted{color:var(--muted)}
.search{width:min(100%,320px);padding:12px 14px;background:#0e1b30;color:white;border:1px solid var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff17;border-radius:21px;background:linear-gradient(160deg,#142746,#0b1729)}
.cover{min-height:150px;padding:20px;display:flex;align-items:end;background:radial-gradient(circle at 80% 20%,#7466ff88,transparent 40%),linear-gradient(135deg,#174a78,#111b39);position:relative}
.symbol{font-size:44px}
.tag{position:absolute;right:12px;top:12px;font-size:10px;letter-spacing:1px;font-weight:900;color:#10172b;background:var(--gold);padding:5px 8px;border-radius:20px}
.cardbody{padding:20px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:21px;line-height:1.3;margin:0 0 10
